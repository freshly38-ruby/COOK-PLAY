<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>쿡앤플레이 — 요리 인스타 캡션 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500;1,600&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* 아이들이 좋아하는 쨍한 주황·노랑 + 부모가 편안해할 크림 배경 */
    --orange:#FF7A33;
    --orange-deep:#B8440B;
    --yellow:#FFD23F;
    --yellow-deep:#8A5A0C;
    --coral:#FF6B57;
    --coral-deep:#C23A26;
    --dark-accent:#2E1A0C;

    /* 왼쪽 패널: 밝은 주황 바탕 + 화이트 스티커 카드 */
    --panel-bg:#FF7A33;
    --panel-bg-deep:#F2611B;
    --panel-text:#2E1A0C;
    --panel-muted:rgba(46,26,12,.66);
    --panel-card-bg:#FFFDF6;
    --panel-card-bg-focus:#FFF3C4;
    --panel-card-border:rgba(46,26,12,.16);
    --panel-card-placeholder:rgba(46,26,12,.38);

    --paper:#FFF6E0;
    --paper-card:#FFFDF6;
    --paper-2:#FBE7BC;
    --ink-on-paper:#2E1A0C;
    --muted-on-paper:rgba(46,26,12,.62);
    --paper-line:rgba(46,26,12,.13);

    --font-serif:'Fraunces','Noto Serif KR', Georgia, serif;
    --font-sans:'Noto Sans KR', -apple-system, 'Malgun Gothic', sans-serif;

    color-scheme: light;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; min-height:100%; }
  body{
    font-family:var(--font-sans);
    background:var(--paper);
    color:var(--ink-on-paper);
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  button, input{ font:inherit; color:inherit; }
  input{ -webkit-appearance:none; appearance:none; }
  button{ cursor:pointer; background:none; border:none; }
  ::selection{ background:var(--yellow); color:var(--dark-accent); }

  .stage{ display:flex; min-height:100vh; align-items:stretch; }

  /* ---------- 왼쪽: 쿡앤플레이 스튜디오(입력) ---------- */
  .atelier{
    width:40%;
    min-width:380px;
    max-width:520px;
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(255,210,63,.4), transparent 55%),
      radial-gradient(140% 110% at 0% 100%, rgba(242,97,27,.35), transparent 60%),
      var(--panel-bg);
    color:var(--panel-text);
    padding:56px 44px 44px;
    display:flex;
    flex-direction:column;
    gap:34px;
  }

  .atelier__eyebrow{
    margin:0;
    font-size:.72rem;
    letter-spacing:.14em;
    color:var(--panel-text);
    font-weight:700;
  }
  .atelier__logo{
    margin:10px 0 0;
    font-family:var(--font-serif);
    font-weight:700;
    font-style:normal;
    font-size:2.6rem;
    line-height:1.05;
    letter-spacing:.005em;
    color:var(--panel-text);
  }
  .atelier__tagline{
    display:inline-block;
    margin:14px 0 0;
    font-family:var(--font-serif);
    font-weight:700;
    font-style:normal;
    font-size:1.3rem;
    line-height:1.4;
    color:var(--dark-accent);
    background:var(--yellow);
    padding:4px 13px;
    border-radius:8px;
  }
  .atelier__desc{
    margin:16px 0 0;
    max-width:34ch;
    color:var(--panel-muted);
    font-size:.98rem;
  }

  .atelier__form{ display:flex; flex-direction:column; gap:22px; }

  .field{ display:flex; flex-direction:column; gap:9px; }
  .field label, .field__label{
    font-size:.82rem;
    color:var(--panel-text);
    font-weight:700;
  }
  .field input{
    background:var(--panel-card-bg);
    border:1px solid var(--panel-card-border);
    border-radius:12px;
    padding:13px 14px;
    color:var(--dark-accent);
    font-size:.96rem;
    transition:border-color .15s ease, background .15s ease;
  }
  .field input::placeholder{ color:var(--panel-card-placeholder); }
  .field input:hover{ border-color:rgba(46,26,12,.3); }
  .field input:focus{
    outline:none;
    border-color:var(--orange-deep);
    background:var(--panel-card-bg-focus);
  }

  .mood-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .mood-swatch{
    text-align:left;
    padding:12px 12px 13px;
    border-radius:12px;
    border:1px solid var(--panel-card-border);
    background:var(--panel-card-bg);
    display:flex;
    flex-direction:column;
    gap:7px;
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .mood-swatch::before{
    content:'';
    width:18px; height:18px;
    border-radius:6px;
    display:block;
  }
  .mood-swatch--warm::before{ background:linear-gradient(135deg,var(--yellow),var(--orange)); }
  .mood-swatch--bold::before{ background:linear-gradient(135deg,var(--dark-accent),var(--coral)); }
  .mood-swatch--calm::before{ background:linear-gradient(135deg,var(--paper-2),var(--yellow-deep)); }
  .mood-swatch__name{ font-family:var(--font-serif); font-weight:600; font-size:.98rem; color:var(--dark-accent); }
  .mood-swatch__hint{ font-size:.72rem; color:var(--panel-muted); line-height:1.35; }
  .mood-swatch:hover{ border-color:rgba(46,26,12,.3); }
  .mood-swatch.is-active{
    border-color:var(--orange-deep);
    background:var(--panel-card-bg-focus);
    box-shadow:0 0 0 3px rgba(255,210,63,.55);
  }

  .cta-generate{
    margin-top:6px;
    padding:15px 20px;
    border-radius:14px;
    background:var(--yellow);
    color:var(--dark-accent);
    font-weight:700;
    font-size:.98rem;
    letter-spacing:.01em;
    text-align:center;
    transition:filter .15s ease, opacity .2s ease;
  }
  .cta-generate:hover{ filter:brightness(1.06); }
  .cta-generate:active{ filter:brightness(.96); }
  .cta-generate:disabled{ cursor:default; }
  .cta-generate.is-loading .cta-generate__label{ opacity:.85; }
  .cta-generate.is-loading{ animation:pulseSoft 1.1s ease-in-out infinite; }

  .status-line{
    min-height:1.6em;
    margin:0;
    font-size:.82rem;
    color:var(--panel-text);
    font-weight:600;
  }
  .status-line.is-fallback{
    display:inline-block;
    color:var(--dark-accent);
    background:var(--paper-card);
    padding:3px 11px;
    border-radius:999px;
    font-weight:700;
  }

  /* ---------- 오른쪽: 캡션 갤러리(결과) ---------- */
  .lookbook{
    flex:1;
    padding:56px 52px 64px;
    display:flex;
    flex-direction:column;
    gap:34px;
    min-width:0;
  }
  .lookbook__head p.eyebrow{
    margin:0 0 8px;
    font-size:.72rem;
    letter-spacing:.14em;
    color:var(--orange-deep);
    font-weight:700;
  }
  .lookbook__head h2{
    margin:0;
    font-family:var(--font-serif);
    font-weight:700;
    font-style:normal;
    font-size:2.1rem;
  }
  .lookbook__head p.desc{
    margin:10px 0 0;
    color:var(--muted-on-paper);
    max-width:52ch;
  }

  /* 미리보기 정사각형 */
  .previews{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
  }
  .preview{
    position:relative;
    aspect-ratio:1/1;
    border-radius:18px;
    background-color:var(--accent);
    color:var(--paper-card);
    padding:14px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    overflow:hidden;
    animation:reveal .5s ease both;
  }
  .preview--orange{ --accent:var(--orange); --accent-deep:var(--orange-deep); }
  .preview--yellow{ --accent:var(--yellow); --accent-deep:var(--yellow-deep); }
  .preview--coral{ --accent:var(--coral); --accent-deep:var(--coral-deep); }

  .preview.mood--warm{
    background-image:radial-gradient(130% 150% at 18% 8%, color-mix(in srgb, var(--accent) 55%, #fff 45%) 0%, var(--accent) 46%, var(--accent-deep) 100%);
    border-radius:22px;
  }
  .preview.mood--bold{
    background-image:linear-gradient(135deg, var(--accent) 0 54%, var(--dark-accent) 54% 100%);
    border-radius:10px;
  }
  .preview.mood--calm{
    background-image:linear-gradient(190deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 25%, var(--paper-card) 75%) 130%);
    border-radius:16px;
  }

  /* 노랑 배경은 밝아서, 따뜻함/차분함일 때는 진한 글씨로 대비를 확보합니다 */
  .preview--yellow.mood--warm .preview__body,
  .preview--yellow.mood--warm .preview__foot,
  .preview--yellow.mood--calm .preview__body,
  .preview--yellow.mood--calm .preview__foot{
    color:var(--ink-on-paper);
    text-shadow:none;
  }
  .preview--yellow.mood--warm .preview__chrome span,
  .preview--yellow.mood--calm .preview__chrome span{
    background:rgba(59,36,16,.45);
  }

  .preview--placeholder{
    background:none;
    border:1.5px dashed var(--paper-line);
    color:var(--muted-on-paper);
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:.78rem;
    padding:14px;
  }

  .preview__chrome{ display:flex; gap:4px; }
  .preview__chrome span{ width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.65); }
  .preview__body{ text-shadow:0 1px 4px rgba(0,0,0,.5); }
  .preview__name{
    margin:0 0 4px;
    font-family:var(--font-serif);
    font-style:normal;
    font-weight:600;
    font-size:1.05rem;
    line-height:1.2;
  }
  .preview__hook{ margin:0; font-size:.74rem; opacity:.92; line-height:1.4; }
  .preview__foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:.68rem;
    letter-spacing:.02em;
    text-shadow:0 1px 3px rgba(0,0,0,.45);
  }

  /* 캡션 카드 */
  .cards{ display:flex; flex-direction:column; }
  .cards__track{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
    align-items:start;
  }
  .cards__dots{ display:none; }

  .card{
    background:var(--paper-card);
    border:1px solid var(--paper-line);
    border-top:5px solid var(--accent);
    border-radius:18px;
    padding:22px 20px 20px;
    display:flex;
    flex-direction:column;
    gap:12px;
    box-shadow:0 1px 2px rgba(59,36,16,.06);
    animation:reveal .5s ease both;
  }
  .card--orange{ --accent:var(--orange); --accent-deep:var(--orange-deep); --accent-tint:#FCE3D2; }
  .card--yellow{ --accent:var(--yellow); --accent-deep:var(--yellow-deep); --accent-tint:#FFF1CE; }
  .card--coral{ --accent:var(--coral); --accent-deep:var(--coral-deep); --accent-tint:#FFE3DE; }

  .card__tag{
    align-self:flex-start;
    display:flex;
    align-items:center;
    gap:7px;
    font-size:.76rem;
    font-weight:600;
    color:var(--accent-deep);
    background:var(--accent-tint, rgba(0,0,0,.05));
    padding:5px 11px;
    border-radius:999px;
  }
  .card__dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); }
  .card__hook{
    margin:2px 0 0;
    font-family:var(--font-serif);
    font-style:normal;
    font-weight:600;
    font-size:1.22rem;
    line-height:1.32;
  }
  .card__body{ margin:0; font-size:.92rem; color:var(--ink-on-paper); }
  .card__cta{
    margin:0;
    font-size:.9rem;
    font-weight:600;
    padding-left:11px;
    border-left:3px solid var(--accent);
  }
  .card__tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:2px; }
  .tag{
    font-size:.74rem;
    color:var(--accent-deep);
    border:1px solid var(--accent-deep);
    border-radius:999px;
    padding:3px 9px;
  }
  .card__foot{
    margin-top:6px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .copy-btn{
    font-size:.85rem;
    font-weight:600;
    color:var(--accent-deep);
    border:1.4px solid var(--accent-deep);
    border-radius:999px;
    padding:8px 16px;
    transition:background .15s ease, color .15s ease;
  }
  .copy-btn:hover{ background:var(--accent-deep); color:var(--paper-card); }
  .copy-status{
    font-size:.78rem;
    color:var(--muted-on-paper);
    opacity:0;
    transition:opacity .2s ease;
  }
  .copy-status.is-visible{ opacity:1; }
  .copy-fallback-area{
    position:absolute;
    width:1px; height:1px;
    top:0; left:0;
    opacity:0.01;
    overflow:hidden;
    border:0;
    padding:0;
  }

  .card--placeholder{
    border-top:5px solid var(--paper-2);
    border-style:dashed;
    color:var(--muted-on-paper);
    align-items:flex-start;
    justify-content:center;
    min-height:190px;
  }
  .card--placeholder p{ margin:0; font-size:.86rem; }

  .dot{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--paper-2);
    transition:background .2s ease, transform .2s ease;
  }
  .dot.is-active{ background:var(--orange); transform:scale(1.25); }

  @keyframes reveal{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes pulseSoft{
    0%,100%{ opacity:1; }
    50%{ opacity:.72; }
  }

  a:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--orange-deep);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  /* ---------- 반응형 ---------- */
  @media (max-width: 980px){
    .stage{ flex-direction:column; }
    .atelier{ width:100%; max-width:none; min-width:0; padding:40px 26px 34px; }
    .lookbook{ padding:40px 22px 56px; }
    .atelier__logo{ font-size:2.1rem; }
    .atelier__tagline{ font-size:1.25rem; }
  }

  @media (max-width: 640px){
    .previews{ gap:10px; }
    .preview{ border-radius:14px !important; padding:11px; }
    .preview__name{ font-size:.88rem; }
    .preview__hook{ display:none; }

    .cards__track{
      display:flex;
      overflow-x:auto;
      scroll-snap-type:x mandatory;
      gap:16px;
      padding-bottom:6px;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .cards__track::-webkit-scrollbar{ display:none; }
    .cards__track .card, .cards__track .card--placeholder{
      flex:0 0 100%;
      scroll-snap-align:center;
    }
    .cards__dots{ display:flex; justify-content:center; gap:9px; margin-top:16px; }
  }
</style>
</head>
<body>
<noscript>
  <p style="padding:28px;font-family:sans-serif;">이 도구를 쓰려면 자바스크립트가 필요해요.</p>
</noscript>

<div class="stage">

  <!-- 왼쪽: 쿡앤플레이 스튜디오 (입력) -->
  <aside class="atelier">
    <div>
      <p class="atelier__eyebrow">COOK &amp; PLAY</p>
      <h1 class="atelier__logo">쿡앤플레이</h1>
      <p class="atelier__tagline">요리하면서 즐겁게</p>
      <p class="atelier__desc">우리 아이와의 요리 콘텐츠에 어울리는 캡션 세 벌을 지어드릴게요.</p>
    </div>

    <form class="atelier__form" id="captionForm">
      <div class="field">
        <label for="nameInput">이름</label>
        <input id="nameInput" type="text" value="아이와 함께 놀면서 요리하기" placeholder="예: 아이와 함께 만드는 요리 클래스, 오늘의 레시피" />
      </div>

      <div class="field">
        <label for="benefitInput">가장 큰 장점</label>
        <input id="benefitInput" type="text" value="혼자 만든 내 요리라는 뿌듯함" placeholder="예: 아이 스스로 완성하는 성취감" />
      </div>

      <div class="field">
        <label for="audienceInput">핵심 고객</label>
        <input id="audienceInput" type="text" value="요리에 관심 많은 초등학생 자녀를 둔 워킹맘" placeholder="예: 바쁘지만 아이와 시간을 보내고 싶은 워킹맘" />
      </div>

      <div class="field">
        <span class="field__label">브랜드 분위기</span>
        <div class="mood-row" role="radiogroup" aria-label="브랜드 분위기">
          <button type="button" class="mood-swatch mood-swatch--warm is-active" data-mood="warm" role="radio" aria-checked="true">
            <span class="mood-swatch__name">따뜻함</span>
            <span class="mood-swatch__hint">다정하고 포근하게</span>
          </button>
          <button type="button" class="mood-swatch mood-swatch--bold" data-mood="bold" role="radio" aria-checked="false">
            <span class="mood-swatch__name">대담함</span>
            <span class="mood-swatch__hint">확신 있고 강렬하게</span>
          </button>
          <button type="button" class="mood-swatch mood-swatch--calm" data-mood="calm" role="radio" aria-checked="false">
            <span class="mood-swatch__name">차분함</span>
            <span class="mood-swatch__hint">담백하고 정돈되게</span>
          </button>
        </div>
      </div>

      <button type="submit" class="cta-generate" id="generateBtn">
        <span class="cta-generate__label">캡션 3종 만들기</span>
      </button>
      <p class="status-line" id="statusLine" aria-live="polite">왼쪽 정보를 확인하고 버튼을 눌러보세요.</p>
    </form>
  </aside>

  <!-- 오른쪽: 캡션 갤러리 (결과) -->
  <main class="lookbook">
    <div class="lookbook__head">
      <p class="eyebrow">완성 캡션</p>
      <h2>캡션 갤러리</h2>
      <p class="desc">완성된 캡션 세 벌과 게시물 미리보기가 이곳에 걸립니다.</p>
    </div>

    <section class="previews" id="previews">
      <div class="preview preview--placeholder">포스트 미리보기<br>대기 중</div>
      <div class="preview preview--placeholder">포스트 미리보기<br>대기 중</div>
      <div class="preview preview--placeholder">포스트 미리보기<br>대기 중</div>
    </section>

    <section class="cards" id="cardsWrap">
      <div class="cards__track" id="cardsTrack">
        <div class="card card--placeholder"><p>아이와 함께 놀면서 요리한 이야기가 여기에 걸려요.</p></div>
        <div class="card card--placeholder"><p>우리 요리 클래스의 장점이 여기에 걸려요.</p></div>
        <div class="card card--placeholder"><p>혼자 만든 내 요리, 그 뿌듯한 순간이 여기에 걸려요.</p></div>
      </div>
      <div class="cards__dots" id="cardsDots"></div>
    </section>
  </main>

</div>

<script>
(function(){
  "use strict";

  var MOOD_META = {
    warm: { label:'따뜻함', hint:'다정하고 포근하게', emoji:'🤍' },
    bold: { label:'대담함', hint:'확신 있고 강렬하게', emoji:'⚡' },
    calm: { label:'차분함', hint:'담백하고 정돈되게', emoji:'' }
  };

  var STYLE_META = {
    friendly:     { label:'친근한 글',   accent:'orange' },
    informative:  { label:'정보형 글',   accent:'yellow' },
    storytelling: { label:'스토리텔링 글', accent:'coral'  }
  };
  var STYLE_ORDER = ['friendly','informative','storytelling'];

  var els = {
    form: document.getElementById('captionForm'),
    nameInput: document.getElementById('nameInput'),
    benefitInput: document.getElementById('benefitInput'),
    audienceInput: document.getElementById('audienceInput'),
    moodButtons: Array.prototype.slice.call(document.querySelectorAll('.mood-swatch')),
    generateBtn: document.getElementById('generateBtn'),
    statusLine: document.getElementById('statusLine'),
    previews: document.getElementById('previews'),
    cardsTrack: document.getElementById('cardsTrack'),
    cardsDots: document.getElementById('cardsDots')
  };

  var currentMood = 'warm';
  var isGenerating = false;
  var captionTexts = {};

  els.moodButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      currentMood = btn.getAttribute('data-mood');
      els.moodButtons.forEach(function(b){
        var active = b === btn;
        b.setAttribute('aria-checked', active ? 'true' : 'false');
        b.classList.toggle('is-active', active);
      });
    });
  });

  els.form.addEventListener('submit', onGenerate);

  function readInputs(){
    return {
      name: (els.nameInput.value || els.nameInput.placeholder || '오늘의 요리 콘텐츠').trim(),
      benefit: (els.benefitInput.value || els.benefitInput.placeholder || '함께하는 즐거움').trim(),
      audience: (els.audienceInput.value || els.audienceInput.placeholder || '우리 아이와 나').trim(),
      mood: currentMood
    };
  }

  async function onGenerate(e){
    e.preventDefault();
    if (isGenerating) return;
    isGenerating = true;

    var inputs = readInputs();
    setLoading(true);

    var data, source;
    try{
      data = await requestAICaptions(inputs);
      source = 'ai';
    }catch(err){
      data = buildFallbackCaptions(inputs);
      source = 'fallback';
    }

    renderPreviews(inputs, data);
    renderCards(data);
    setLoading(false, source);
    isGenerating = false;
  }

  function setLoading(loading, source){
    els.generateBtn.disabled = loading;
    els.generateBtn.classList.toggle('is-loading', loading);
    var label = els.generateBtn.querySelector('.cta-generate__label');
    if (loading){
      label.textContent = '캡션을 짓는 중…';
      els.statusLine.textContent = 'AI가 콘텐츠를 분석하고 있어요…';
      els.statusLine.classList.remove('is-fallback');
    } else {
      label.textContent = '캡션 3종 만들기';
      if (source === 'ai'){
        els.statusLine.textContent = 'AI가 입력 내용을 분석해 캡션 3종을 완성했어요.';
        els.statusLine.classList.remove('is-fallback');
      } else {
        els.statusLine.textContent = '지금 환경에서는 AI 대신 기본 템플릿으로 캡션을 만들었어요.';
        els.statusLine.classList.add('is-fallback');
      }
    }
  }

  /* ---------------- AI 호출 ---------------- */

  function buildPrompt(inputs){
    var meta = MOOD_META[inputs.mood];
    return [
      '당신은 한국 인스타그램 콘텐츠 마케터입니다. 아래 정보로 실제 게시 가능한 인스타그램 캡션 3종을 한국어로 작성하세요.',
      '',
      '[정보]',
      '- 이름: ' + inputs.name,
      '- 가장 큰 장점: ' + inputs.benefit,
      '- 핵심 고객: ' + inputs.audience,
      '- 브랜드 분위기: ' + meta.label + ' (' + meta.hint + ')',
      '',
      '[규칙]',
      '1. friendly(친근한 대화체, 이모지 0~2개), informative(정보 전달형, 장점과 근거 중심, 과장 없이), storytelling(구체적인 한 장면으로 시작하는 이야기형) 3가지를 각각 하나씩 작성합니다.',
      '2. 각 항목은 hook(스크롤을 멈추게 할 첫 문장, 25자 내외), body(2~4문장, 위 정보를 실제로 반영), cta(팔로워에게 요청할 구체적 행동 한 문장), hashtags(관련성 높은 한국어 해시태그 정확히 5개, # 포함, 띄어쓰기 없음)를 모두 포함합니다.',
      '3. 브랜드 분위기 "' + meta.label + '"이 세 톤 모두에 자연스럽게 드러나야 합니다.',
      '4. 다른 설명이나 코드블록 없이, 아래 형식의 순수 JSON 객체 하나만 출력하세요.',
      '',
      '{"friendly":{"hook":"","body":"","cta":"","hashtags":["","","","",""]},"informative":{"hook":"","body":"","cta":"","hashtags":["","","","",""]},"storytelling":{"hook":"","body":"","cta":"","hashtags":["","","","",""]}}'
    ].join('\n');
  }

  async function requestAICaptions(inputs){
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, 25000);
    var res;
    try{
      res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          messages: [{ role: 'user', content: buildPrompt(inputs) }]
        }),
        signal: controller.signal
      });
    } finally {
      clearTimeout(timer);
    }

    if (!res.ok) throw new Error('API 응답 오류: ' + res.status);

    var json = await res.json();
    var text = (json.content || [])
      .map(function(block){ return block && block.type === 'text' ? block.text : ''; })
      .join('\n')
      .trim();

    var start = text.indexOf('{');
    var end = text.lastIndexOf('}');
    if (start === -1 || end === -1 || end < start) throw new Error('JSON을 찾을 수 없음');

    var parsed = JSON.parse(text.slice(start, end + 1));
    return normalizeResult(parsed, inputs);
  }

  function normalizeResult(parsed, inputs){
    var fallback = buildFallbackCaptions(inputs);
    var result = {};
    STYLE_ORDER.forEach(function(key){
      var src = parsed && typeof parsed === 'object' ? parsed[key] : null;
      if (!src || typeof src !== 'object'){
        result[key] = fallback[key];
        return;
      }
      var hook = (typeof src.hook === 'string' && src.hook.trim()) ? src.hook.trim() : fallback[key].hook;
      var body = (typeof src.body === 'string' && src.body.trim()) ? src.body.trim() : fallback[key].body;
      var cta  = (typeof src.cta  === 'string' && src.cta.trim())  ? src.cta.trim()  : fallback[key].cta;

      var hashtags = Array.isArray(src.hashtags)
        ? src.hashtags.filter(function(t){ return typeof t === 'string' && t.trim(); })
                      .map(function(t){
                        var trimmed = t.trim().replace(/\s+/g,'');
                        return trimmed.charAt(0) === '#' ? trimmed : '#' + trimmed.replace(/^#+/, '');
                      })
        : [];
      hashtags = Array.from(new Set(hashtags));
      if (hashtags.length < 5){
        var extra = fallback[key].hashtags.filter(function(t){ return hashtags.indexOf(t) === -1; });
        hashtags = hashtags.concat(extra).slice(0, 5);
      } else {
        hashtags = hashtags.slice(0, 5);
      }

      result[key] = { hook: hook, body: body, cta: cta, hashtags: hashtags };
    });
    return result;
  }

  /* ---------------- 기본 템플릿(폴백) ---------------- */

  function hasBatchim(str){
    var s = String(str || '').trim();
    if (!s) return false;
    var code = s.charCodeAt(s.length - 1);
    if (code >= 0xAC00 && code <= 0xD7A3){
      return (code - 0xAC00) % 28 !== 0;
    }
    return false;
  }
  function josa(str, withBatchim, noBatchim){
    return hasBatchim(str) ? withBatchim : noBatchim;
  }

  function shortTag(str, maxLen){
    var cleaned = String(str || '').replace(/[^0-9A-Za-z가-힣\s]/g, '').trim();
    var compact = cleaned.split(/\s+/).join('');
    return compact.slice(0, maxLen || 10);
  }

  function buildHashtags(inputs, meta){
    var nameTag = shortTag(inputs.name, 10);
    var benefitTag = shortTag(inputs.benefit, 10);
    var audienceTag = shortTag(inputs.audience, 10);
    var pool = [nameTag, benefitTag, audienceTag, meta.label, '오늘의요리','아이와함께','워킹맘일상','자기주도요리','인스타그램']
      .filter(function(t){ return t && t.length; })
      .map(function(t){ return '#' + t; });
    return Array.from(new Set(pool)).slice(0, 5);
  }

  var FALLBACK_TEMPLATES = {
    warm: {
      friendly: function(i){ return {
        hook: i.name + ', 오늘은 이 얘기부터 할게요 🤍',
        body: i.benefit + '. 이 하나만으로 ' + i.audience + '의 하루가 한층 포근해져요. 저희도 만들 때마다 그 온기를 느껴요.',
        cta: '어떤 점이 마음에 드는지 댓글로 살짝 알려주세요 🤍'
      };},
      informative: function(i){ return {
        hook: i.name + ', 따뜻함의 비결은 ' + i.benefit + '입니다.',
        body: i.audience + josa(i.audience,'을','를') + ' 생각하며 ' + i.benefit + '에 정성을 들였습니다. 서두르지 않고, 꼭 필요한 만큼만 담았습니다.',
        cta: '자세한 이야기는 프로필 링크에서 천천히 살펴보세요.'
      };},
      storytelling: function(i){ return {
        hook: '문을 열자마자, ' + i.benefit + josa(i.benefit,'이','가') + ' 먼저 반겼습니다.',
        body: '그 하루의 끝을 ' + i.name + josa(i.name,'과','와') + ' 함께한 ' + i.audience + josa(i.audience,'은','는') + ' 어깨의 힘을 조금 내려놓았다고 했어요. 작은 온기 하나가 하루를 바꿉니다.',
        cta: '당신의 하루 끝엔 어떤 순간이 필요한가요? 댓글로 들려주세요.'
      };}
    },
    bold: {
      friendly: function(i){ return {
        hook: i.name + ', 이건 그냥 넘기지 마세요!',
        body: i.benefit + '. ' + i.audience + josa(i.audience,'이라면','라면') + ' 무조건 알아야 할 이야기예요. 망설일 이유가 없어요.',
        cta: "지금 바로 댓글에 '나도'라고 남겨주세요!"
      };},
      informative: function(i){ return {
        hook: i.name + '의 핵심은 명확합니다: ' + i.benefit + '.',
        body: i.audience + josa(i.audience,'을','를') + ' 위해 타협 없이 ' + i.benefit + '에 집중했습니다. 근거 없는 말은 하지 않습니다.',
        cta: '증거가 궁금하다면 프로필 링크를 지금 확인하세요.'
      };},
      storytelling: function(i){ return {
        hook: '그 순간, ' + i.audience + '의 생각이 바뀌었습니다.',
        body: i.name + josa(i.name,'을','를') + ' 처음 마주한 사람들은 하나같이 ' + i.benefit + '에 놀랐다고 말합니다. 망설이던 마음은 그날로 사라졌습니다.',
        cta: '당신도 그 순간을 직접 확인해보세요.'
      };}
    },
    calm: {
      friendly: function(i){ return {
        hook: i.name + josa(i.name,'을','를') + ' 소개합니다.',
        body: i.benefit + '. ' + i.audience + '에게 잘 어울리는 선택이라 생각해요. 편하게 살펴보셔도 좋아요.',
        cta: '궁금한 점이 있다면 댓글 남겨주세요.'
      };},
      informative: function(i){ return {
        hook: i.name + ', 근거는 ' + i.benefit + '입니다.',
        body: i.audience + '의 필요를 기준으로 ' + i.benefit + josa(i.benefit,'을','를') + ' 만들었습니다. 불필요한 설명은 덜어냈습니다.',
        cta: '자세한 내용은 프로필 링크에서 확인하실 수 있습니다.'
      };},
      storytelling: function(i){ return {
        hook: '어느 날, ' + i.audience + ' 한 분이 ' + i.name + josa(i.name,'을','를') + ' 조용히 만났습니다.',
        body: '그 분은 ' + i.benefit + ' 안에서 필요한 만큼의 편안함을 찾았다고 했습니다. ' + i.name + josa(i.name,'은','는') + ' 그렇게, 담백하게 곁에 있습니다.',
        cta: '당신의 이야기도 천천히 들려주세요.'
      };}
    }
  };

  function buildFallbackCaptions(inputs){
    var meta = MOOD_META[inputs.mood] || MOOD_META.warm;
    var tpl = FALLBACK_TEMPLATES[inputs.mood] || FALLBACK_TEMPLATES.warm;
    var hashtags = buildHashtags(inputs, meta);
    var out = {};
    STYLE_ORDER.forEach(function(key){
      var piece = tpl[key](inputs);
      out[key] = { hook: piece.hook, body: piece.body, cta: piece.cta, hashtags: hashtags };
    });
    return out;
  }

  /* ---------------- 렌더링 ---------------- */

  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(ch){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch];
    });
  }

  function truncate(str, max){
    str = String(str || '');
    return str.length > max ? str.slice(0, max - 1) + '…' : str;
  }

  function composeCaptionText(cap){
    return cap.hook + '\n\n' + cap.body + '\n\n' + cap.cta + '\n\n' + cap.hashtags.join(' ');
  }

  function renderPreviews(inputs, data){
    els.previews.innerHTML = STYLE_ORDER.map(function(key, idx){
      var meta = STYLE_META[key];
      var cap = data[key];
      return (
        '<div class="preview preview--' + meta.accent + ' mood--' + inputs.mood + '" style="animation-delay:' + (idx * 70) + 'ms">' +
          '<div class="preview__chrome"><span></span><span></span><span></span></div>' +
          '<div class="preview__body">' +
            '<p class="preview__name">' + escapeHtml(truncate(inputs.name, 18)) + '</p>' +
            '<p class="preview__hook">' + escapeHtml(truncate(cap.hook, 26)) + '</p>' +
          '</div>' +
          '<div class="preview__foot"><span>' + escapeHtml(meta.label) + '</span><span aria-hidden="true">♡ ⚬</span></div>' +
        '</div>'
      );
    }).join('');
  }

  function renderCards(data){
    captionTexts = {};
    els.cardsTrack.innerHTML = STYLE_ORDER.map(function(key, idx){
      var meta = STYLE_META[key];
      var cap = data[key];
      captionTexts[key] = composeCaptionText(cap);
      var tagsHtml = cap.hashtags.map(function(t){ return '<span class="tag">' + escapeHtml(t) + '</span>'; }).join('');
      return (
        '<article class="card card--' + meta.accent + '" data-style="' + key + '" style="animation-delay:' + (idx * 70) + 'ms">' +
          '<div class="card__tag"><span class="card__dot"></span>' + escapeHtml(meta.label) + '</div>' +
          '<p class="card__hook">' + escapeHtml(cap.hook) + '</p>' +
          '<p class="card__body">' + escapeHtml(cap.body) + '</p>' +
          '<p class="card__cta">' + escapeHtml(cap.cta) + '</p>' +
          '<div class="card__tags">' + tagsHtml + '</div>' +
          '<div class="card__foot">' +
            '<button type="button" class="copy-btn" data-copy="' + key + '">캡션 복사</button>' +
            '<span class="copy-status" data-status="' + key + '" aria-live="polite"></span>' +
          '</div>' +
          '<textarea class="copy-fallback-area" data-fallback="' + key + '" tabindex="-1" aria-hidden="true"></textarea>' +
        '</article>'
      );
    }).join('');

    Array.prototype.slice.call(els.cardsTrack.querySelectorAll('.copy-btn')).forEach(function(btn){
      btn.addEventListener('click', function(){ handleCopy(btn.getAttribute('data-copy'), btn); });
    });

    setupDots();
  }

  function flashStatus(el, msg, persist){
    if (!el) return;
    el.textContent = msg;
    el.classList.add('is-visible');
    if (!persist){
      clearTimeout(el._timer);
      el._timer = setTimeout(function(){ el.classList.remove('is-visible'); }, 2800);
    }
  }

  function selectCardText(card){
    var nodes = [
      card.querySelector('.card__hook'),
      card.querySelector('.card__body'),
      card.querySelector('.card__cta'),
      card.querySelector('.card__tags')
    ].filter(Boolean);
    if (!nodes.length) return;
    var range = document.createRange();
    range.setStartBefore(nodes[0]);
    range.setEndAfter(nodes[nodes.length - 1]);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  async function handleCopy(key, btnEl){
    var text = captionTexts[key];
    var card = btnEl.closest('.card');
    var statusEl = card.querySelector('.copy-status[data-status="' + key + '"]');

    try{
      if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('clipboard API 없음');
      await navigator.clipboard.writeText(text);
      flashStatus(statusEl, '복사 완료');
      return;
    }catch(err){
      var ta = card.querySelector('.copy-fallback-area');
      ta.value = text;
      ta.focus();
      ta.select();
      var ok = false;
      try{ ok = document.execCommand('copy'); }catch(e2){ ok = false; }
      if (ok){
        flashStatus(statusEl, '복사 완료');
        ta.blur();
        return;
      }
      selectCardText(card);
      flashStatus(statusEl, '자동 복사가 막혀 있어요. 선택된 글자를 Ctrl+C(맥은 Cmd+C)로 복사해주세요.', true);
    }
  }

  function setupDots(){
    var cards = Array.prototype.slice.call(els.cardsTrack.querySelectorAll('.card'));
    els.cardsDots.innerHTML = cards.map(function(_, i){
      return '<button type="button" class="dot" data-index="' + i + '" aria-label="' + (i + 1) + '번째 캡션 보기"></button>';
    }).join('');
    var dots = Array.prototype.slice.call(els.cardsDots.querySelectorAll('.dot'));
    if (dots[0]) dots[0].classList.add('is-active');

    dots.forEach(function(dot){
      dot.addEventListener('click', function(){
        var idx = Number(dot.getAttribute('data-index'));
        if (cards[idx]) cards[idx].scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
      });
    });

    if ('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if (entry.isIntersecting){
            var idx = cards.indexOf(entry.target);
            dots.forEach(function(d){ d.classList.remove('is-active'); });
            if (dots[idx]) dots[idx].classList.add('is-active');
          }
        });
      }, { root: els.cardsTrack, threshold: 0.6 });
      cards.forEach(function(c){ io.observe(c); });
    }
  }

})();
</script>
</body>
